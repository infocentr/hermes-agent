name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR/push (via the ci.yml orchestrator's workflow_call)
# and on a weekly schedule against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the supply-chain-audit.yml workflow (which scans for malicious
# code patterns in PR diffs) by covering the orthogonal "currently-pinned
# dep became known-vulnerable" case.
#
# Private mirrors may not have GitHub Code Security / Advanced Security,
# so do not depend on SARIF upload to GitHub Code Scanning. Run OSV directly,
# keep the JSON/SARIF files as workflow artifacts, and print a concise summary.

on:
  workflow_call:
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    name: Scan lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run OSV scanner JSON report
        id: osv-json
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output-file=results.json
            --format=json
            --lockfile=uv.lock
            --lockfile=package-lock.json
            --lockfile=website/package-lock.json

      - name: Run OSV scanner SARIF report
        id: osv-sarif
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output-file=results.sarif
            --format=sarif
            --lockfile=uv.lock
            --lockfile=package-lock.json
            --lockfile=website/package-lock.json

      - name: Summarize OSV findings
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("results.json")
          print("# OSV-Scanner summary")
          if not path.exists():
              print("\nNo results.json was produced; inspect the workflow logs.")
              raise SystemExit(0)

          data = json.loads(path.read_text())
          results = data.get("results", [])
          vulns = []
          by_file = Counter()
          by_package = Counter()

          for result in results:
              source = result.get("source", {})
              lockfile = source.get("path") or source.get("lockfile") or "unknown"
              packages = result.get("packages", [])
              for package in packages:
                  package_info = package.get("package", {})
                  name = package_info.get("name", "unknown")
                  version = package_info.get("version", "unknown")
                  for vuln in package.get("vulnerabilities", []):
                      vuln_id = vuln.get("id", "unknown")
                      aliases = ", ".join(vuln.get("aliases", []))
                      vulns.append((lockfile, name, version, vuln_id, aliases))
                      by_file[lockfile] += 1
                      by_package[f"{name}@{version}"] += 1

          print(f"\nTotal vulnerability findings: **{len(vulns)}**")
          if by_file:
              print("\n## By lockfile")
              for lockfile, count in by_file.most_common():
                  print(f"- `{lockfile}`: {count}")
          if by_package:
              print("\n## Top packages")
              for package, count in by_package.most_common(20):
                  print(f"- `{package}`: {count}")
          if vulns:
              print("\n## First 50 findings")
              for lockfile, name, version, vuln_id, aliases in vulns[:50]:
                  suffix = f" ({aliases})" if aliases else ""
                  print(f"- `{lockfile}`: `{name}@{version}` — `{vuln_id}`{suffix}")
          PY

      - name: Upload OSV artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-scanner-results
          path: |
            results.json
            results.sarif
          if-no-files-found: warn
